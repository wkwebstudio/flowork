<style>
:root{--purple:#7758e8;--pink:#ff6b9d;--green:#20b486;--bg:#f6f4ff;--card:#fff;--ink:#302d4a;--mut:#8b86a4;--line:#ebe7fb;--soft:#f4f0ff;--ok-bg:#e5fff5;--ok:#087c5a;--bad-bg:#fff0f4;--bad:#ce4264;--field:#faf9ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#17152a;--card:#221f3a;--ink:#ece9ff;--mut:#9d98bd;--line:#35315a;--soft:#2c2850;--ok-bg:#12382e;--ok:#5fe0b6;--bad-bg:#402032;--bad:#ff8fa8;--field:#1c1932}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;padding:24px 14px;font-family:'Poppins',system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh}
.wrap{max-width:1000px;margin:auto}
.hero{text-align:center;padding:24px 18px;border-radius:26px;color:#fff;background:linear-gradient(120deg,#7857e8,#b06af4,#ff78ad)}
.hero h1{margin:4px 0;font-size:clamp(22px,5vw,34px);font-weight:800}.hero p{margin:6px 0 0;opacity:.95;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:18px}
h2{font-size:18px;margin:0 0 12px}h3{font-size:14px;margin:14px 0 6px}
.grid{display:grid;grid-template-columns:290px 1fr;gap:16px;margin-top:18px}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.side .card,.main .card{margin-top:0}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:600;border:2px solid transparent}
.item:hover{background:var(--soft)}.item.on{background:var(--soft);border-color:var(--purple);color:var(--purple)}
.item small{color:var(--mut);font-weight:500}
input[type=text],textarea{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink);font:500 14px 'Poppins',sans-serif;outline:none}
input:focus,textarea:focus{border-color:var(--purple)}
textarea{min-height:200px;resize:vertical;line-height:1.7}
label{font-size:12px;font-weight:700;color:var(--mut);display:block;margin:12px 0 5px}
.btn{border:none;border-radius:12px;padding:10px 16px;font:700 13px 'Poppins',sans-serif;cursor:pointer;background:var(--soft);color:var(--purple)}
.btn:hover{transform:translateY(-1px)}
.btn.p{color:#fff;background:linear-gradient(100deg,#7858e8,#a16aef)}.btn.g{color:#fff;background:linear-gradient(100deg,#20b486,#3fd0a2)}.btn.d{color:var(--bad);background:var(--bad-bg)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border-radius:10px;background:var(--soft);font-size:12px;font-weight:600;margin:3px}
.gaprow{display:flex;gap:8px;align-items:center;margin:6px 0}.gaprow b{min-width:58px;font-size:12px;color:var(--purple)}
.hint{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.6}
.big{border:3px solid var(--purple);background:linear-gradient(120deg,var(--soft),var(--card))}.pol{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--pink)}.polt{font-size:clamp(18px,3.4vw,24px);font-weight:800;line-height:1.4;margin-top:4px}
.dt{border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:14px}.dt summary{cursor:pointer;font-weight:700;font-size:14px}
.dz{border:2px dashed var(--purple);border-radius:14px;padding:14px;text-align:center;font-size:13px;font-weight:600;color:var(--mut);margin-top:8px}.dz.on{background:var(--soft)}
.emo{display:inline-block;border:none;background:var(--soft);border-radius:10px;font-size:36px;padding:2px 8px;margin:3px;cursor:pointer;line-height:1.3}.emo:hover{transform:scale(1.15)}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tab{padding:8px 14px;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;background:var(--soft);color:var(--purple)}.tab.on{background:var(--purple);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-size:12px}
.sc{font-weight:800}.sc.hi{color:var(--ok)}.sc.lo{color:var(--bad)}
.tablewrap{overflow-x:auto}
.story{font-size:15px;line-height:2.7;flex:1;min-width:0}
.lay.has::after{content:"";display:block;clear:both}
.pics{float:right;width:min(38%,320px);margin:0 0 12px 18px}
.pics img{display:block;width:100%;border-radius:14px;margin-bottom:12px;border:1px solid var(--line)}
@media(max-width:560px){.pics{float:none;width:100%;margin:0 0 12px}}
.blank{width:140px;max-width:100%;padding:6px 9px;margin:3px;border:2px solid var(--line);border-radius:10px;background:var(--field);color:var(--purple);font:600 14px 'Poppins',sans-serif;outline:none;display:inline-block}
.blank:focus{border-color:var(--purple)}.blank.correct{border-color:var(--green);background:var(--ok-bg);color:var(--ok)}.blank.wrong{border-color:#ff7190;background:var(--bad-bg);color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:9px}.word{border:2px solid var(--line);background:var(--soft);color:var(--purple);border-radius:12px;padding:8px 12px;font:700 13px 'Poppins',sans-serif;cursor:pointer}.word.used{opacity:.35;text-decoration:line-through}
.inst{padding:12px 14px;border-radius:14px;background:var(--soft);font-weight:600;font-size:14px;line-height:1.6;margin-bottom:14px}
.bar{background:var(--line);height:9px;border-radius:99px;margin-top:16px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7758e8,#ff75ae);transition:width .3s}
.res{display:none;margin-top:16px;padding:16px;border-radius:14px;background:var(--soft);font-weight:600;line-height:1.8}
.code{width:100%;font-size:11px;min-height:60px;margin-top:6px}
.msg{font-size:12px;font-weight:600;color:var(--green);margin-left:6px}
.empty{color:var(--mut);font-size:13px;padding:10px 0}
/* HALLOWEEN */
.wrap,.ground{position:relative;z-index:1}.hero{position:relative}
:root:not(.plain):not([data-theme="light"]){color-scheme:dark;--bg:#160d2b;--card:#241540;--ink:#fff1de;--mut:#c3a9e8;--line:#4b2f7a;--soft:#34205c;--purple:#ff8a1f;--pink:#b86bff;--green:#3ddc97;--ok-bg:#123b2e;--ok:#6ff0b8;--bad-bg:#47203a;--bad:#ff8fa8;--field:#1b1033}
html:not(.plain) body{background:radial-gradient(circle at 12% 0%,#6b2bb066,transparent 45%),radial-gradient(circle at 92% 100%,#ff7a0040,transparent 42%),#160d2b}
html:not(.plain) .hero{background:linear-gradient(120deg,#ff7a00,#d4470a 45%,#5b21b6);box-shadow:0 10px 30px #ff7a0040}
html:not(.plain) .btn.p{background:linear-gradient(100deg,#ff7a00,#ff4d2e);color:#fff}
html:not(.plain) .bar i{background:linear-gradient(90deg,#ff8a1f,#b86bff)}
html:not(.plain) .card{border-color:#5a3a92;position:relative}
html:not(.plain) .card:nth-of-type(3n+1)::before{content:"";position:absolute;top:0;right:52px;width:2px;height:30px;background:#cdbbf0aa;pointer-events:none}
html:not(.plain) .card:nth-of-type(3n+1)::after{content:"🕷️";position:absolute;top:26px;right:41px;font-size:24px;pointer-events:none;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(8px)}}
.spd{position:absolute;top:100%;margin-top:-1px;transform-origin:top center;animation:sw 3s ease-in-out infinite alternate;z-index:2;pointer-events:none}
.spd i{display:block;width:2px;height:var(--h);background:#e5d9ff;margin:0 auto}.spd b{display:block;font-size:28px;margin-top:-6px;line-height:1}
@keyframes sw{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}

/* ---------- CROSSWORD ---------- */
const cwFold=s=>String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/Ł/g,'L');
const cwClean=a=>String(a||'').toUpperCase().replace(/[\s\-'’.,!?]/g,'');
function cwRng(seed){let t=seed>>>0;return()=>{t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296}}

    const order=words.map((w,i)=>i).filter(i=>words[i].length>1).sort((a,b)=>words[b].length-words[a].length||rnd()-0.5);
    for(let k=2;k<order.length;k++)if(rnd()<0.35){const x=order[k];order[k]=order[k-1];order[k-1]=x}
    if(!order.length)continue;
    const grid=new Map(),placed=[],un=[];const key=(r,c)=>r+','+c;

      if(grid.has(key(r-dr,c-dc))||grid.has(key(r+dr*w.length,c+dc*w.length)))return -1;
      for(let k=0;k<w.length;k++){const rr=r+dr*k,cc=c+dc*k,g=grid.get(key(rr,cc));
        if(g){if(g.ch!==w[k]||g.d.includes(d))return -1;inter++}
        else if(d==='A'){if(grid.has(key(rr-1,cc))||grid.has(key(rr+1,cc)))return -1}
        else if(grid.has(key(rr,cc-1))||grid.has(key(rr,cc+1)))return -1}
      return inter};
    const put=(i,r,c,d)=>{const w=words[i],dr=d==='D'?1:0,dc=d==='A'?1:0;for(let k=0;k<w.length;k++){const kk=key(r+dr*k,c+dc*k),g=grid.get(kk);if(g)g.d+=d;else grid.set(kk,{ch:w[k],d})}placed.push([i,r,c,d])};
    const bounds=()=>{let a=1e9,b=-1e9,c=1e9,d=-1e9;grid.forEach((v,k)=>{const [r,cc]=k.split(',').map(Number);a=Math.min(a,r);b=Math.max(b,r);c=Math.min(c,cc);d=Math.max(d,cc)});return[a,b,c,d]};
    put(order[0],0,0,'A');

const FCOL=['#7758e8','#ff6b9d','#20b486','#f59e0b','#0ea5e9','#e0457b','#8b5cf6','#14b8a6'];
const hcol=s=>{let h=0;for(const c of String(s||''))h=(h*31+c.charCodeAt(0))>>>0;return FCOL[h%FCOL.length]};
const pctOf=r=>r.t?Math.max(0,Math.min(100,Math.round(r.c/r.t*100))):0;
const scCls=p=>p>=80?'hi':p>=50?'mid':'lo';
const iniOf=n=>String(n||'?').trim().split(/\s+/).map(w=>w[0]||'').join('').slice(0,2).toUpperCase()||'?';
const seenKey=()=>'fw_seen_'+(window.__UID||'');
const getSeen=()=>{try{return localStorage.getItem(seenKey())||''}catch(e){return ''}};
const newResCount=()=>{const s=rvSeen!==null?rvSeen:getSeen();return S.res.filter(r=>S.ex.some(x=>x.id===r.ex)&&String(r.d)>s).length};
const inScope=x=>curF==='all'||(!!x.folder&&isDesc(x.folder,curF));
const dayLbl=d=>{const t=new Date(d),n=new Date();const a=new Date(t.getFullYear(),t.getMonth(),t.getDate()),b=new Date(n.getFullYear(),n.getMonth(),n.getDate());const k=Math.round((b-a)/864e5);
  return k===0?'Dziś':k===1?'Wczoraj':t.toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'})};
const hm=d=>new Date(d).toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});
function resDash(){
  if(rvSeen===null){rvSeen=getSeen();try{localStorage.setItem(seenKey(),new Date().toISOString())}catch(e){}}
  const map={};S.ex.forEach(x=>map[x.id]=x);
  let rs=S.res.filter(r=>map[r.ex]);
  const q=norm(rvQ);if(q)rs=rs.filter(r=>norm(r.n).includes(q)||norm(map[r.ex].title||'').includes(q));
  rs.sort((a,b)=>String(b.d).localeCompare(String(a.d)));
  const td=new Date().toDateString(),nT=rs.filter(r=>new Date(r.d).toDateString()===td).length;
  const avg=rs.length?Math.round(rs.reduce((s,r)=>s+pctOf(r),0)/rs.length):0,st=new Set(rs.map(r=>norm(r.n))).size;
  const scope='Wszystkie ćwiczenia, ze wszystkich folderów';
  const row=r=>{const x=map[r.ex],p=pctOf(r),t=TYP[tyOf(x)];return `<button class="rvr" data-oe="${x.id}"><span class="av" style="--ac:${hcol(norm(r.n))}">${esc(iniOf(r.n))}</span><span class="rvm"><b>${esc(r.n)}</b>${String(r.d)>rvSeen?'<i class="nwt">Nowe</i>':''}<small>${t[0]} ${esc(x.title||'Bez tytułu')}</small></span><span class="scp ${scCls(p)}">${p}%</span><span class="rvt">${hm(r.d)}</span></button>`};
  let body='';
  if(!rs.length)body=`<div class="rve0"><div>📭</div><b>${q?'Nic nie znaleziono':'Jeszcze nie ma odpowiedzi'}</b>${q?'Spróbuj wpisać inne imię albo tytuł.':'Wybierz ćwiczenie, kliknij „🔗 Generuj link” i wyślij go uczniom. Ich odpowiedzi pojawią się tutaj automatycznie.'}</div>`;
  else if(rvTab==='ex'){const g={};rs.forEach(r=>(g[r.ex]=g[r.ex]||[]).push(r));
    body='<div class="rveg">'+Object.keys(g).sort((a,b)=>String(g[b][0].d).localeCompare(String(g[a][0].d))).map(id=>{const x=map[id],L=g[id],t=TYP[tyOf(x)],a=Math.round(L.reduce((s,r)=>s+pctOf(r),0)/L.length),nw=L.filter(r=>String(r.d)>rvSeen).length;
      return `<button class="rve" data-oe="${id}" style="--tc:${t[3]}"><span class="rveh"><span class="ti">${t[0]}</span><b>${esc(x.title||'Bez tytułu')}</b><span class="scp ${scCls(a)}">${a}%</span></span><span class="rvbar"><i style="width:${a}%"></i></span><small>${L.length} ${L.length===1?'odpowiedź':L.length<5?'odpowiedzi':'odpowiedzi'} · ostatnia: ${dayLbl(L[0].d).toLowerCase()} ${hm(L[0].d)}${nw?` · <b style="color:#ff4d6d">${nw} nowe</b>`:''}</small></button>`}).join('')+'</div>'}
  else if(rvTab==='fo'){const g={};rs.forEach(r=>{const k=map[r.ex].folder&&S.folders.some(f=>f.id===map[r.ex].folder)?map[r.ex].folder:'';(g[k]=g[k]||[]).push(r)});
    body=Object.keys(g).sort((a,b)=>String(g[b][0].d).localeCompare(String(g[a][0].d))).map(k=>{const L=g[k],a=Math.round(L.reduce((s,r)=>s+pctOf(r),0)/L.length),nm=k?fpath(k).map(f=>f.name).join(' › '):'Bez folderu',ne=new Set(L.map(r=>r.ex)).size;
      return `<details class="rvs" open><summary><span class="av" style="--ac:${k?((S.folders.find(f=>f.id===k)||{}).col||hcol(k)):'#94a3b8'}">📁</span><span class="rvm"><b>${esc(nm)}</b>${L.some(r=>String(r.d)>rvSeen)?'<i class="nwt">Nowe</i>':''}<small>${L.length} odpowiedzi · ${ne} ćwiczeń</small></span><span class="scp ${scCls(a)}">${a}%</span></summary><div class="rvl">${L.map(row).join('')}</div></details>`}).join('')}
  else if(rvTab==='st'){const g={};rs.forEach(r=>{const k=norm(r.n);(g[k]=g[k]||[]).push(r)});
    body=Object.keys(g).sort((a,b)=>String(g[b][0].d).localeCompare(String(g[a][0].d))).map(k=>{const L=g[k],a=Math.round(L.reduce((s,r)=>s+pctOf(r),0)/L.length),n=L[0].n;
      return `<details class="rvs"><summary><span class="av" style="--ac:${hcol(k)}">${esc(iniOf(n))}</span><span class="rvm"><b>${esc(n)}</b>${L.some(r=>String(r.d)>rvSeen)?'<i class="nwt">Nowe</i>':''}<small>${L.length} ${L.length===1?'ćwiczenie':'ćwiczeń'} · ostatnio: ${dayLbl(L[0].d).toLowerCase()} ${hm(L[0].d)}</small></span><span class="scp ${scCls(a)}">${a}%</span></summary><div class="rvl">${L.map(row).join('')}</div></details>`}).join('')}
  else{let last='';rs.forEach(r=>{const l=dayLbl(r.d);if(l!==last){body+=`<div class="rvd">${esc(l)}</div>`;last=l}body+=row(r)})}
  return `<div class="card rvc"><div class="rvh"><div><h2>📊 Odpowiedzi uczniów</h2><small>${scope}</small></div><div class="row" style="margin:0"><button class="btn" id="rvcsv" title="Pobierz tabelę wyników">⬇ CSV</button><button class="btn" id="rvref">↻ Odśwież</button></div></div>
  <div class="rvk"><div><b>${rs.length}</b><span>Odpowiedzi</span></div><div><b>${nT}</b><span>Dzisiaj</span></div><div><b>${rs.length?avg+'%':'–'}</b><span>Średni wynik</span></div><div><b>${st}</b><span>Uczniów</span></div></div>
  <div class="rvtb"><div class="seg">${[['new','🕒 Najnowsze'],['ex','📚 Wg ćwiczeń'],['fo','📁 Wg folderów'],['st','👤 Wg uczniów']].map(t=>`<button data-rvt="${t[0]}" class="${rvTab===t[0]?'on':''}">${t[1]}</button>`).join('')}</div><input type="text" id="rvq" placeholder="🔍 Szukaj ucznia lub ćwiczenia…" value="${esc(rvQ)}"></div>
  <div id="rvb">${body}</div></div>`}
function bindDash(){const m=document.querySelector('.main');if(!m)return;
  m.onclick=async ev=>{const fc=ev.target.closest('[data-fc]');if(fc){const f=S.folders.find(z=>z.id===curF);if(f){f.col=fc.dataset.fc;save();teacher()}return}const o=ev.target.closest('[data-oe]');if(o&&!ev.target.closest('summary')){curE=o.dataset.oe;tab='res';note='';teacher();window.scrollTo(0,0);return}
    const t=ev.target.closest('[data-rvt]');if(t){rvTab=t.dataset.rvt;drawDash();return}
    if(ev.target.closest('#rvcsv')){resCSV();return}
    if(ev.target.closest('#rvref')){const b=$('#rvref');b.disabled=true;b.textContent='Sprawdzam…';const before=S.res.length;try{await pollRes()}catch(e){}if(S.res.length===before){toast('✔ Brak nowych odpowiedzi');drawDash()}}};
  const q=$('#rvq');if(q)q.oninput=()=>{rvQ=q.value;const p=q.selectionStart;drawDash();const n=$('#rvq');if(n){n.focus();try{n.setSelectionRange(p,p)}catch(e){}}}}
function drawDash(){const m=document.querySelector('.main');if(!m||curE)return;if(pv!=='res'){teacher();return}m.innerHTML=resDash();bindDash()}

/* ---------- v12: wspólne dla nowych ćwiczeń ---------- */
const exHead=e=>{const st='padding:9px;border-radius:12px;border:2px solid var(--line);background:var(--field);color:var(--ink);font:500 14px Poppins';return `<label style="margin-top:0">Tytuł</label><input type="text" id="t" value="${esc(e.title)}">
  <label>Polecenie dla ucznia</label><input type="text" id="n" value="${esc(e.inst||'')}">
  <label>Folder</label><select id="fo" style="${st}">${folderOpts(e.folder)}</select>`};
const exFoot=e=>`<div class="row">${genBtns(e)}<button class="btn" id="pv">👁 Podgląd</button><button class="btn" id="dup">📄 Kopiuj ćwiczenie</button><button class="btn d" id="del">Usuń ćwiczenie</button></div><div id="lk"></div>`;
function exBindHead(e,valid,play,obj){const t=$('#t'),n=$('#n');t.oninput=()=>{e.title=t.value;save()};n.oninput=()=>{e.inst=n.value;save()};$('#fo').onchange=ev=>{e.folder=ev.target.value;save();teacher()};
  bindLinkBtns(e,valid);
  $('#pv').onclick=()=>{const er=valid();if(er){toast('⚠️ '+er);return}play(Object.assign(obj(e),{p:1}));app.insertAdjacentHTML('afterbegin','<div class="row" style="margin:0 0 12px"><button class="btn p" id="bkp">← Wróć do edycji</button></div>');$('#bkp').onclick=goBack};
  $('#del').onclick=async()=>{if(await modal({title:'Usunąć to ćwiczenie?',text:'Razem z wynikami.',ok:'Usuń'})){S.ex=S.ex.filter(z=>z.id!==e.id);S.res=S.res.filter(r=>r.ex!==e.id);curE=null;save();teacher()}}}
const shuf=a=>{const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r};
function exIntro(ex,box,chip,hint,start){
  box.innerHTML=`${ex.n?`<section class="card big"><div class="pol">📌 Polecenie</div><div class="polt">${esc(ex.n)}</div></section>`:''}<section class="card"><div class="row" style="margin:0"><span class="chip2">${chip}</span></div><label>Twoje imię i nazwisko</label><input type="text" id="qn" placeholder="np. Anna Kowalska" style="max-width:340px"><div class="row"><button class="btn p" id="go" style="font-size:18px;padding:14px 30px">▶ Start</button></div><div class="hint">${hint}</div></section>`;
  $('#go').onclick=async()=>{const v=$('#qn').value.trim();if(!v){$('#qn').focus();$('#qn').style.borderColor='#ff7190';return}
    if(ex.fb&&!ex.p&&!ex.mo){const g=$('#go');g.disabled=true;g.textContent='Sprawdzam…';try{const d=await fbReq(ex.fb,'/res/'+ex.i,'GET');const mine=Object.values(d||{}).find(r=>r&&r.n&&norm(r.n)===norm(v));
      if(mine){start(v,mine);return}}catch(e){}}
    beep('ok');start(v,null)}}
function exFinish(ex,kind,name,score,N,log,show){const code=enc({i:ex.i,n:name,c:score,t:N,d:new Date().toISOString(),a:log});let msg='';
  if(!ex.p){notifyT(ex,name,score,N);try{if(!ex.mo)localStorage.setItem('luki_done_'+ex.i,JSON.stringify({[kind]:1,name:name,score:score,log:log,code:code}))}catch(e){}
    if(ex.fb){msg='Wysyłam wynik do nauczyciela…';const mark=(t,bad)=>{const s=$('#sent');if(s){s.textContent=t;if(bad)s.style.color='var(--bad)'}if(bad)cwOpen()};
      fbReq(ex.fb,'/res/'+ex.i,'POST',{n:name,c:score,t:N,d:new Date().toISOString(),a:log}).then(()=>mark('✔ Wynik został wysłany do nauczyciela.'),()=>mark('Nie udało się wysłać wyniku automatycznie. Kliknij 🔑 w prawym dolnym rogu, skopiuj kod i wyślij go nauczycielowi.',1))}
    else msg='Wyślij nauczycielowi kod wyniku: kliknij 🔑 w prawym dolnym rogu.'}
  show(name,score,log,code,msg)}
function exEnd(ex,box,nm,sc,N,rows,code,msg,emo,again){const pc=N?Math.round(sc/N*100):0;
  box.innerHTML=`<section class="card" style="text-align:center"><div style="font-size:70px;animation:pop .6s">${pc>=90?'🏆':pc>=60?emo:'💪'}</div><div class="sbig" id="fs">0</div><div style="font-weight:800;font-size:18px">${esc(nm)}, wynik: ${sc} z ${N} (${pc}%)</div><div class="msg" id="sent" style="display:block;margin-top:10px">${msg||''}</div></section>
  <section class="card"><h2>Twoje odpowiedzi</h2>${rows}</section>${(ex.p||ex.mo)?'<div class="row"><button class="btn p" id="again">↺ Zagraj jeszcze raz</button></div>':''}`;
  const e2=$('#fs'),s0=performance.now();const an=n=>{const p=Math.min(1,(n-s0)/800);e2.textContent=Math.round(sc*p);if(p<1)requestAnimationFrame(an)};requestAnimationFrame(an);
  if(code)cwShow(code,!ex.fb&&!ex.p);beep('win');confetti(TE(),pc>=50?36:12);const ag=$('#again');if(ag)ag.onclick=again;window.scrollTo(0,0)}
const imgFile=async(f,big)=>{if(!f||!f.type||!f.type.startsWith('image/'))throw new Error('To nie jest zdjęcie');if(big){const s=await shrink(f,1100,0.72);return s.url()}return imgUp(f)};

/* ---------- v12: DOPASOWYWANIE (przeciąganie par) ---------- */
const mtPairs=e=>(e.pr||[]).filter(p=>(String(p.l||'').trim()||p.im)&&String(p.r||'').trim());
const mtObj=e=>({i:e.id,t:e.title,n:e.inst,k:'m',pr:mtPairs(e).map(p=>[String(p.l||'').trim(),String(p.r).trim(),p.im||'']),dx:String(e.dx||'').split(',').map(s=>s.trim()).filter(Boolean)});
function mtEdit(e){e.pr=e.pr||[];
  return exHead(e)+`<div class="dt" style="margin-top:14px"><b>🔗 Pary do dopasowania</b><div class="hint" style="margin:4px 0 10px">Lewa strona zostaje na miejscu, a uczeń przeciąga do niej pasującą odpowiedź (albo dotyka odpowiedzi, a potem miejsca).</div>
   ${e.pr.map((p,j)=>`<div class="cwe mte" data-j="${j}"><b class="mtn">${j+1}</b><div class="mtl">${p.im?`<img src="${esc(p.im)}" alt="">`:''}<input type="text" data-fld="ml" data-j="${j}" value="${esc(p.l||'')}" placeholder="${p.im?'Podpis (opcjonalnie)':'Lewa strona, np. dog'}"></div><button class="btn" data-v="mi" data-j="${j}" title="${p.im?'Usuń zdjęcie':'Dodaj zdjęcie'}">${p.im?'✕ 🖼':'🖼'}</button><span class="mta">↔</span><input type="text" data-fld="mr" data-j="${j}" value="${esc(p.r||'')}" placeholder="Pasująca odpowiedź, np. pies"><button class="btn d" data-v="rm" data-j="${j}" title="Usuń parę">✕</button></div>`).join('')}
   <div class="row"><button class="btn p" data-v="am">+ Dodaj parę</button></div>
   <label>Dodatkowe błędne odpowiedzi (opcjonalnie, po przecinku)</label><input type="text" id="mdx" value="${esc(e.dx||'')}" placeholder="np. kot, ryba">
   <label>Wklej listę (jedna para w linii: lewa - prawa)</label><textarea id="mtbulk" style="min-height:90px" placeholder="dog - pies&#10;cat - kot"></textarea><div class="row"><button class="btn" data-v="bulk">➕ Dodaj z listy</button></div>
   <div class="hint">Zdjęcie do lewej strony: kliknij 🖼 albo przeciągnij plik ze zdjęciem na wiersz pary. Błędne odpowiedzi utrudniają zgadywanie.</div></div>`+exFoot(e)}
function mtBind(e){const main=document.querySelector('.main');
  const valid=()=>mtPairs(e).length>=2?'':'Dodaj co najmniej dwie pełne pary.';
  exBindHead(e,valid,mtPlay,mtObj);$('#mdx').oninput=ev=>{e.dx=ev.target.value;save()};
  main.oninput=ev=>{const el=ev.target,f=el.dataset.fld,j=+el.dataset.j;if(f==='ml'&&e.pr[j])e.pr[j].l=el.value;else if(f==='mr'&&e.pr[j])e.pr[j].r=el.value;else return;save()};
  const setIm=async(j,f)=>{try{toast('⏳ Wgrywam zdjęcie…');e.pr[j].im=await imgFile(f);save();teacher()}catch(x){toast('⚠️ '+((x&&x.message)||x))}};
  main.onclick=async ev=>{const b=ev.target.closest('[data-v]');if(!b)return;const a=b.dataset.v,j=+b.dataset.j;
    if(a==='am')e.pr.push({l:'',r:''});
    else if(a==='rm')e.pr.splice(j,1);
    else if(a==='mi'){if(e.pr[j].im)delete e.pr[j].im;else{const f=await pickImg();if(f)setIm(j,f);return}}
    else if(a==='bulk'){const add=$('#mtbulk').value.split('\n').map(pairSplit).filter(Boolean).map(p=>({l:p[0],r:p[1]}));if(!add.length){toast('⚠️ Wklej pary, np. dog - pies (jedna w linii).');return}e.pr=e.pr.filter(p=>(p.l||'').trim()||p.im||(p.r||'').trim()).concat(add)}
    else return;
    save();teacher()};
  main.ondragover=ev=>{const r=ev.target.closest('.mte');if(r&&[...(ev.dataTransfer.items||[])].some(i=>i.kind==='file')){ev.preventDefault();main.querySelectorAll('.mte.dropOn').forEach(x=>x!==r&&x.classList.remove('dropOn'));r.classList.add('dropOn')}};
  main.ondragleave=ev=>{const r=ev.target.closest('.mte');if(r&&!r.contains(ev.relatedTarget))r.classList.remove('dropOn')};
  main.ondrop=ev=>{const r=ev.target.closest('.mte');if(!r)return;const f=[...(ev.dataTransfer.files||[])][0];if(!f)return;ev.preventDefault();r.classList.remove('dropOn');setIm(+r.dataset.j,f)}}
function mtPlay(ex){
  const PR=Object.values(ex.pr||[]).map(p=>Object.values(p)).filter(p=>p&&String(p[1]||'').trim());const N=PR.length;const DX=Object.values(ex.dx||[]);
  let saved=null;if(!ex.p&&!ex.mo){try{saved=JSON.parse(localStorage.getItem('luki_done_'+ex.i))}catch(e){}}
  app.innerHTML=hdr(esc(ex.t||'Dopasowywanie'),'🔗 Dopasuj pary'+(ex.n?' · '+esc(ex.n):''))+'<div id="mta"></div>';
  const box=$('#mta');
  const left=p=>`${p[2]?`<img src="${esc(p[2])}" alt="" data-zoom="1">`:''}${p[0]?`<span>${big(esc(p[0]))}</span>`:''}`;
  const rowsOf=lg=>lg.map((x,i)=>{const p=PR[x[2]]||['?','?',''];return `<div class="rv" style="animation-delay:${Math.min(i,12)*0.05}s"><span>${x[1]?'✔':'✘'}</span><span style="flex:1">${esc(p[0]||'🖼')} → ${esc(x[0]||'(brak)')}${x[1]?'':` <small>(poprawnie: ${esc(p[1])})</small>`}</span></div>`}).join('');
  const show=(nm,sc,lg,code,msg)=>exEnd(ex,box,nm,sc,N,rowsOf(lg),code,msg,'🔗',()=>board(nm));
  function board(name){
    const chips=shuf([...PR.map(p=>String(p[1])),...DX.map(String)]);
    const slot=Array(N).fill(null);let sel=null,locked=false;
    const chip=(ci,inSlot)=>`<button type="button" class="mtc ${sel===ci?'sel':''}" draggable="${!locked}" data-c="${ci}">${esc(chips[ci])}</button>`;
    const draw=()=>{const used=new Set(slot.filter(x=>x!==null)),fl=used.size;
      box.innerHTML=`<section class="card mtw"><div class="qh"><span class="chip2">🔗 Dopasowano ${fl}/${N}</span>${ex.p?'<span class="chip2">👁 Podgląd</span>':''}</div><div class="qbar"><i style="width:${N?fl/N*100:0}%"></i></div>
      <div class="mtb"><div class="mtrows">${PR.map((p,i)=>`<div class="mtr ${locked?(slot[i]!==null&&norm(chips[slot[i]])===norm(p[1])?'good':'bad'):''}"><div class="mtlft">${left(p)}</div><div class="mtar">➜</div><div class="mtslot ${slot[i]!==null?'full':''} ${sel!==null&&!locked?'hot':''}" data-s="${i}">${slot[i]!==null?chip(slot[i],1):'<span class="mtph">Upuść tutaj</span>'}</div>${locked&&!(slot[i]!==null&&norm(chips[slot[i]])===norm(p[1]))?`<div class="mtcor">✔ ${esc(p[1])}</div>`:''}</div>`).join('')}</div>
      <div class="mtpool" id="mtpool"><div class="mtph">Odpowiedzi</div>${chips.map((c,ci)=>used.has(ci)?'':chip(ci)).join('')}</div></div>
      <div class="row" style="justify-content:center">${locked?'':'<button class="btn" id="mtrst">↺ Wyczyść</button><button class="btn p" id="mtck">✅ Sprawdź</button>'}</div><div id="mtfb"></div></section>`;
      if(!locked){$('#mtrst').onclick=()=>{slot.fill(null);sel=null;draw()};$('#mtck').onclick=check}};
    const place=(ci,s)=>{const k=slot.indexOf(ci);if(k>=0)slot[k]=null;slot[s]=ci;sel=null;beep('tap');draw()};
    const back=ci=>{const k=slot.indexOf(ci);if(k>=0)slot[k]=null;sel=null;draw()};
    box.onclick=ev=>{const z=ev.target.closest('[data-zoom]');if(z){z.classList.toggle('zoom');return}if(locked)return;
