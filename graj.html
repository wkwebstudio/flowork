<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2e1065">
<title>Flowork Live – dołącz do gry</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Poppins,system-ui,sans-serif;color:#fff;background:linear-gradient(150deg,#2e1065,#6d28d9 55%,#be185d) fixed;display:flex;flex-direction:column;min-height:100dvh;overflow-x:hidden}
#top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;font-size:15px;opacity:.9}#top b{font-weight:900}#me{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;max-width:60%}#me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#me .avs{width:30px;height:auto;flex:none}
#app{flex:1;display:flex;flex-direction:column;padding:8px 16px calc(16px + env(safe-area-inset-bottom));max-width:560px;width:100%;margin:0 auto}
.c{margin:auto 0;text-align:center;animation:in .35s cubic-bezier(.2,1.3,.4,1)}@keyframes in{from{opacity:0;transform:translateY(14px) scale(.96)}}
h1{font-size:30px;font-weight:900;line-height:1.15;margin-bottom:8px}p{font-size:16px;opacity:.9;line-height:1.5}
.card{background:#fff;color:#1e1b4b;border-radius:24px;padding:20px;box-shadow:0 18px 40px #0006;text-align:center}
input[type=text],input[type=tel]{width:100%;font:800 22px Poppins,sans-serif;text-align:center;padding:14px;border-radius:16px;border:2.5px solid #ddd6fe;color:#1e1b4b;background:#f5f3ff;outline:none}input:focus{border-color:#7c3aed}
#code{font-size:34px;letter-spacing:.14em}
.b{display:block;width:100%;font:800 20px Poppins,sans-serif;padding:15px;border-radius:16px;border:0;background:linear-gradient(100deg,#6d28d9,#db2777);color:#fff;cursor:pointer;box-shadow:0 6px 0 #0003;margin-top:12px}.b:active{transform:translateY(3px);box-shadow:0 3px 0 #0003}.b:disabled{opacity:.5}
.b.g{background:#ede9fe;color:#5b21b6;box-shadow:none;font-size:16px;padding:11px}
.err{color:#be123c;font-weight:700;font-size:14.5px;min-height:20px;margin-top:8px}
.lbl{font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#7c3aed;margin:4px 0 8px}
.avp{width:150px;margin:0 auto 6px;line-height:0}.avp svg{width:100%;height:auto;filter:drop-shadow(0 8px 10px #0003)}
.pk{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;margin-top:8px}.pk button{height:44px;border-radius:14px;border:0;background:#ede9fe;color:#5b21b6;font:900 22px Poppins;cursor:pointer}.pk button:active{background:#ddd6fe}.pk div{font-weight:700;font-size:15px}.pk small{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#a78bfa}
.gn{font:800 24px Poppins;padding:14px;border-radius:16px;background:#f5f3ff;border:2.5px solid #ddd6fe}
.big{width:170px;margin:0 auto 10px;line-height:0}.big svg{width:100%;height:auto;filter:drop-shadow(0 10px 14px #0006)}.big.bounce{animation:bo 1.4s ease-in-out infinite alternate}@keyframes bo{to{transform:translateY(-10px)}}
.dots::after{content:"";animation:dots 1.4s steps(4) infinite}@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.qh{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.85;text-align:center}.qt{font-size:19px;font-weight:800;text-align:center;line-height:1.3;margin:6px 0 10px;overflow-wrap:anywhere}
.tb{height:9px;border-radius:9px;background:#ffffff33;overflow:hidden;margin-bottom:12px}.tb i{display:block;height:100%;background:#fff;width:100%}
.opts{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:300px}.opts.n2{grid-template-columns:1fr}.opts.long{grid-template-columns:1fr}
.o{border:0;border-radius:20px;background:var(--c);color:#fff;font:800 18px Poppins,sans-serif;padding:12px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-shadow:inset 0 -6px 0 #0003,0 6px 14px #0004;overflow-wrap:anywhere;text-shadow:0 2px 0 #0003;min-height:84px}.o:active{transform:scale(.97)}.o svg{width:34px;height:34px;flex:none;filter:drop-shadow(0 2px 0 #0003)}.opts.long .o{flex-direction:row;justify-content:flex-start;text-align:left;padding:12px 16px}
.res{border-radius:28px;padding:26px 18px;box-shadow:0 18px 40px #0006}.res.ok{background:linear-gradient(160deg,#22c55e,#15803d)}.res.no{background:linear-gradient(160deg,#f43f5e,#9f1239)}.res.na{background:linear-gradient(160deg,#64748b,#334155)}
.res .ic{width:84px;height:84px;margin:0 auto 8px;border-radius:50%;background:#ffffff33;display:grid;place-items:center}.res .ic svg{width:48px;height:48px}
.res b.pt{display:inline-block;margin-top:8px;background:#0003;border-radius:99px;padding:6px 18px;font-size:20px;font-weight:900}
.stat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}.stat div{background:#ffffff1f;border:1.5px solid #ffffff33;border-radius:16px;padding:10px 4px}.stat small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.8}.stat b{font-size:22px;font-weight:900}
.medal{font-size:64px;font-weight:900;line-height:1;width:120px;height:120px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;box-shadow:inset 0 -8px 0 #0003,0 10px 24px #0006}.m1{background:linear-gradient(#fde047,#f59e0b);color:#78350f}.m2{background:linear-gradient(#f1f5f9,#94a3b8);color:#334155}.m3{background:linear-gradient(#fdba74,#c2410c);color:#7c2d12}.m0{background:#ffffff26}
.cor{margin-top:10px;font-size:15px;opacity:.95}
.dgb{background:#fff;color:#1e1b4b;border-radius:18px;padding:10px 12px;margin-bottom:10px;display:flex;flex-direction:column;gap:6px;font-size:14.5px;max-height:34vh;overflow:auto}.dgb div{max-width:88%;align-self:flex-start}.dgb div.r{align-self:flex-end;text-align:right}.dgb small{display:block;font-size:10.5px;font-weight:800;color:#7c3aed}.dgb span{display:inline-block;background:#f5f3ff;border-radius:12px;padding:5px 10px;text-align:left}.dgb div.r span{background:#fce7f3}.dgb p{font-size:13px;opacity:.7}.opts.sm{min-height:180px}.opts.sm .o{min-height:60px;font-size:16px}
.res.pa{background:linear-gradient(160deg,#f59e0b,#b45309)}
.ux{display:flex;flex-direction:column;gap:10px;flex:1}
.sqs,.mtl{display:flex;flex-direction:column;gap:7px}
.sqslot,.mrow{display:flex;align-items:center;gap:10px;min-height:50px;padding:6px 10px;border-radius:16px;border:2px dashed #ffffff66;background:#ffffff14;color:#fff;font:700 15.5px Poppins,sans-serif;text-align:left;width:100%}
.sqslot .mb,.mrow .mb,.mchip .mb{flex:none;width:32px;height:32px;border-radius:10px;background:var(--c);display:grid;place-items:center;font-weight:900;color:#fff;box-shadow:inset 0 -3px 0 #0003}
.sqslot.next{border-style:solid;border-color:#fff;background:#ffffff26}
.sqslot.full{border:2px solid #fff;background:#fff;color:#1e1b4b;box-shadow:0 4px 0 #0003}.sqslot.nw{animation:uxin .3s cubic-bezier(.2,1.5,.4,1)}
@keyframes uxin{from{transform:scale(.8);opacity:0}}
.sqp{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;padding:10px;border-radius:18px;background:#0000002e}
.soi,.mchip{border:0;background:#fff;color:#1e1b4b;font:700 15px Poppins,sans-serif;padding:10px 14px;border-radius:14px;box-shadow:0 4px 0 #0003;display:inline-flex;align-items:center;gap:8px;text-align:left}
.soi.used{opacity:.25;transform:scale(.92);box-shadow:none}
.mrow{border-style:solid;border-color:#ffffff40}.mrow .ml{flex:1;min-width:0}.mrow .ms{flex:none;max-width:45%;padding:5px 10px;border-radius:10px;background:#00000033;font-size:14px;overflow-wrap:anywhere}
.mrow.sel{border-color:#fff;background:#ffffff33;box-shadow:0 0 0 3px #ffffff55}.mrow.pair{background:#fff;color:#1e1b4b;border-color:transparent}.mrow.pair .ms{background:var(--c);color:#fff}
.mchip.sel{box-shadow:0 0 0 4px #fde047}.mchip.used{background:#ffffffb3}.mchip .mb{width:24px;height:24px;border-radius:7px;font-size:13px}
.mhint{text-align:center;font-size:13px;opacity:.85}
.b:disabled{opacity:.45;filter:grayscale(.5)}

.kwc{display:inline-block;margin:4px 0;padding:2px 12px;border-radius:10px;background:#ffffff2e;border:2px solid #ffffff66;font-size:.9em;letter-spacing:.06em}
.tchip{display:inline-block;background:var(--c);border:2px solid #fff;border-radius:99px;padding:3px 14px;font-weight:800;font-size:14px;text-shadow:0 1px 0 #0004}
.tbig{font-size:38px;font-weight:900;background:var(--c);border:4px solid #fff;border-radius:24px;padding:18px 10px;margin-top:8px;box-shadow:0 14px 30px #0006;text-shadow:0 3px 0 #0004}
.rbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.rbar span:not(.tchip){background:#ffffff1f;border:1.5px solid #ffffff33;border-radius:14px;padding:5px 14px;text-align:center;min-width:76px}.rbar small{display:block;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.8}.rbar b{font-size:20px;font-weight:900}
.rfb{position:fixed;inset:0;display:none;place-items:center;z-index:5;text-align:center;padding:20px}.rfb.on{display:grid;animation:in .2s}.rfb.ok{background:#16a34aee}.rfb.no{background:#be123cee}.rfb svg{width:90px;height:90px;display:block;margin:0 auto 6px}.rfb b{display:block;font-size:34px;font-weight:900}.rfb small{display:block;font-size:17px;margin-top:8px;opacity:.95}
</style>
</head>
<body>
<div id="top"><span><b>Flowork</b> Live</span><span id="me"></span></div>
<main id="app"><div class="c"><p class="dots">Wczytuję</p></div></main>
<script>/* Flowork Live: awatary (SVG) i losowe nazwy */
const AV=(()=>{
 const FACES=[{sk:'#f7c9a3',sd:'#e2a67c',hair:'#6b3f1d',k:'short',eye:'dot',mouth:'smile'},{sk:'#e0a877',sd:'#c2875a',hair:'#1f1a17',k:'curly',eye:'happy',mouth:'grin'},{sk:'#8d5a3b',sd:'#6f4329',hair:'#17110d',k:'afro',eye:'dot',mouth:'teeth'},{sk:'#fbe0cc',sd:'#eab99b',hair:'#f2c14e',k:'long',eye:'wink',mouth:'smile'},
  {sk:'#f5c6a0',sd:'#dda07a',hair:'#d9480f',k:'tails',eye:'dot',mouth:'tongue'},{sk:'#86d993',sd:'#57b56b',hair:'',k:'alien',eye:'alien',mouth:'tiny'},{sk:'#9fb4c9',sd:'#7890a8',hair:'',k:'robot',eye:'led',mouth:'grid'},{sk:'#f6a54a',sd:'#d9822b',hair:'',k:'cat',eye:'cat',mouth:'cat'}];
 const SH=[['#ef4444','solid'],['#2563eb','stripes'],['#16a34a','dots'],['#facc15','zig'],['#7c3aed','grad'],['#111827','star'],['#f8fafc','heart'],['#f97316','check'],['#0d9488','bolt'],['#ec4899','flower']];
 const ACC=['brak','czapka','cylinder','beanie','korona','okulary','okulary przeciwsłoneczne','słuchawki','kolczyki','kokarda','kapelusz czarodzieja'];
 const shirt=(i,u)=>{const s=SH[i%SH.length],c=s[0],p=s[1],id='avs'+u;let d='',ov='';
  if(p==='stripes')d=`<pattern id="${id}" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="${c}"/><rect width="10" height="4" fill="#fff" opacity=".85"/></pattern>`;
  else if(p==='dots')d=`<pattern id="${id}" width="11" height="11" patternUnits="userSpaceOnUse"><rect width="11" height="11" fill="${c}"/><circle cx="5.500" cy="5.500" r="2.200" fill="#fff" opacity=".9"/></pattern>`;
  else if(p==='zig')d=`<pattern id="${id}" width="12" height="9" patternUnits="userSpaceOnUse"><rect width="12" height="9" fill="${c}"/><path d="M0 7 L3 2 L6 7 L9 2 L12 7" fill="none" stroke="#b45309" stroke-width="2"/></pattern>`;
  else if(p==='grad')d=`<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#2563eb"/></linearGradient>`;
  else if(p==='check')d=`<pattern id="${id}" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="${c}"/><rect width="6" height="6" fill="#7c2d12" opacity=".55"/><rect x="6" y="6" width="6" height="6" fill="#7c2d12" opacity=".55"/></pattern>`;
  if(p==='star')ov='<path d="M50 90l2.400 5 5.500.700-4 3.800 1 5.500-4.900-2.700-4.900 2.700 1-5.500-4-3.800 5.500-.700z" fill="#facc15"/>';
  if(p==='heart')ov='<path d="M50 104c-6-4.500-9-7.500-9-11a4.600 4.600 0 0 1 9-1.500 4.600 4.600 0 0 1 9 1.500c0 3.500-3 6.500-9 11z" fill="#ef4444"/>';
  if(p==='bolt')ov='<path d="M53 87l-9 11h6l-3 9 10-12h-6z" fill="#fde047"/>';
  if(p==='flower')ov='<g transform="translate(50 97)"><g fill="#fff">'+[0,72,144,216,288].map(a=>`<circle r="3.600" cx="0" cy="-5" transform="rotate(${a})"/>`).join('')+'</g><circle r="2.600" fill="#facc15"/></g>';
  const fill=d?`url(#${id})`:c;
  return (d?`<defs>${d}</defs>`:'')+`<path d="M8 112 Q8 84 36 80 L64 80 Q92 84 92 112 Z" fill="${fill}" stroke="#0002" stroke-width="1"/><path d="M38 80 Q50 92 62 80 L60 79 Q50 86 40 79 Z" fill="#0002"/>`+ov};
 const eyes=(k)=>k==='dot'?'<circle cx="39" cy="46" r="3.600" fill="#1b1209"/><circle cx="61" cy="46" r="3.600" fill="#1b1209"/><circle cx="40.200" cy="44.800" r="1.200" fill="#fff"/><circle cx="62.200" cy="44.800" r="1.200" fill="#fff"/>'
  :k==='happy'?'<path d="M34 47 Q39 41 44 47 M56 47 Q61 41 66 47" fill="none" stroke="#1b1209" stroke-width="3" stroke-linecap="round"/>'
  :k==='wink'?'<circle cx="39" cy="46" r="3.600" fill="#1b1209"/><circle cx="40.200" cy="44.800" r="1.200" fill="#fff"/><path d="M56 46.500 Q61 43 66 46.500" fill="none" stroke="#1b1209" stroke-width="3" stroke-linecap="round"/>'
  :k==='alien'?'<ellipse cx="38" cy="46" rx="7" ry="9.500" fill="#0b1026" transform="rotate(18 38 46)"/><ellipse cx="62" cy="46" rx="7" ry="9.500" fill="#0b1026" transform="rotate(-18 62 46)"/><circle cx="36" cy="42" r="2" fill="#fff"/><circle cx="60" cy="42" r="2" fill="#fff"/>'
  :k==='led'?'<rect x="31" y="40" width="14" height="10" rx="3" fill="#0b1026"/><rect x="55" y="40" width="14" height="10" rx="3" fill="#0b1026"/><rect x="34" y="43" width="8" height="4" rx="2" fill="#22d3ee"/><rect x="58" y="43" width="8" height="4" rx="2" fill="#22d3ee"/>'
  :'<ellipse cx="39" cy="46" rx="5" ry="6" fill="#fef9c3"/><ellipse cx="61" cy="46" rx="5" ry="6" fill="#fef9c3"/><ellipse cx="39" cy="46" rx="1.600" ry="5" fill="#1b1209"/><ellipse cx="61" cy="46" rx="1.600" ry="5" fill="#1b1209"/>';
 const mouth=(k)=>k==='smile'?'<path d="M40 60 Q50 69 60 60" fill="none" stroke="#7a2e1d" stroke-width="3" stroke-linecap="round"/>'
  :k==='grin'?'<path d="M38 58 Q50 72 62 58 Z" fill="#7a2e1d"/><path d="M41 59.500 Q50 63 59 59.500 L58 58.500 H42 Z" fill="#fff"/>'
  :k==='teeth'?'<path d="M39 58 H61 Q60 69 50 69 Q40 69 39 58 Z" fill="#5a1f14"/><rect x="42" y="58" width="16" height="4.500" rx="1" fill="#fff"/>'
  :k==='tongue'?'<path d="M40 59 Q50 67 60 59" fill="none" stroke="#7a2e1d" stroke-width="3" stroke-linecap="round"/><path d="M47 62 h8 v4 a4 4 0 0 1 -8 0z" fill="#f87171"/>'
  :k==='tiny'?'<ellipse cx="50" cy="63" rx="3.500" ry="2.200" fill="#14532d"/>'
  :k==='grid'?'<rect x="39" y="58" width="22" height="8" rx="2" fill="#0b1026"/><path d="M44.500 58 v8 M50 58 v8 M55.500 58 v8" stroke="#9fb4c9" stroke-width="1.400"/>'
  :'<path d="M50 56 l-3 -3 h6z" fill="#7a2e1d"/><path d="M50 56 v3 M50 59 Q46 63 42 60 M50 59 Q54 63 58 60" fill="none" stroke="#7a2e1d" stroke-width="2" stroke-linecap="round"/><path d="M30 55 l-9 -2 M30 58 l-9 2 M70 55 l9 -2 M70 58 l9 2" stroke="#7a2e1d" stroke-width="1.200" stroke-linecap="round"/>';
 const head=(f)=>{const F=FACES[f%FACES.length],h=F.hair;let back='',front='',base='';
  if(F.k==='robot'){base=`<path d="M50 14 v-8" stroke="#64748b" stroke-width="3"/><circle cx="50" cy="5" r="3.500" fill="#ef4444"/><rect x="18" y="38" width="6" height="16" rx="2" fill="#64748b"/><rect x="76" y="38" width="6" height="16" rx="2" fill="#64748b"/><rect x="23" y="18" width="54" height="56" rx="12" fill="${F.sk}"/><rect x="23" y="18" width="54" height="56" rx="12" fill="none" stroke="${F.sd}" stroke-width="2"/><circle cx="29" cy="24" r="1.600" fill="${F.sd}"/><circle cx="71" cy="24" r="1.600" fill="${F.sd}"/>`}
  else{
   if(F.k==='long')back=`<path d="M19 46 Q16 14 50 13 Q84 14 81 46 L83 84 Q72 80 70 60 L30 60 Q28 80 17 84 Z" fill="${h}"/>`;
   if(F.k==='afro')back=`<circle cx="50" cy="36" r="36" fill="${h}"/><circle cx="22" cy="44" r="12" fill="${h}"/><circle cx="78" cy="44" r="12" fill="${h}"/>`;
   if(F.k==='tails')back=`<circle cx="14" cy="50" r="10" fill="${h}"/><circle cx="86" cy="50" r="10" fill="${h}"/><circle cx="19" cy="42" r="3" fill="#22d3ee"/><circle cx="81" cy="42" r="3" fill="#22d3ee"/>`;
   if(F.k==='cat')back=`<path d="M24 34 L20 6 L44 22 Z M76 34 L80 6 L56 22 Z" fill="${F.sk}"/><path d="M26 28 L24 13 L37 22 Z M74 28 L76 13 L63 22 Z" fill="#fbcfe8"/>`;
   if(F.k==='alien')back=`<path d="M36 20 Q30 6 24 4 M64 20 Q70 6 76 4" stroke="${F.sd}" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="24" cy="4" r="4" fill="#fde047"/><circle cx="76" cy="4" r="4" fill="#fde047"/>`;
   base=back+`<rect x="42" y="68" width="16" height="16" rx="6" fill="${F.sd}"/>`+(F.k==='alien'?`<path d="M50 14 C76 14 84 34 80 50 C76 66 62 78 50 78 C38 78 24 66 20 50 C16 34 24 14 50 14 Z" fill="${F.sk}"/>`:`<circle cx="50" cy="46" r="30" fill="${F.sk}"/>`)+`<ellipse cx="20" cy="48" rx="4" ry="6" fill="${F.sd}"/><ellipse cx="80" cy="48" rx="4" ry="6" fill="${F.sd}"/>`;
   if(F.k==='cat')base+=`<path d="M38 18 l4 9 M50 16 v10 M62 18 l-4 9" stroke="${F.sd}" stroke-width="3" stroke-linecap="round"/>`;
   if(F.k==='short')front=`<path d="M20 44 Q18 14 50 14 Q82 14 80 44 Q74 30 62 27 Q50 34 30 28 Q23 34 20 44 Z" fill="${h}"/>`;
   if(F.k==='curly')front=[[26,28,10],[38,19,11],[52,16,11],[65,20,10],[75,30,9],[22,39,7],[79,40,6]].map(c=>`<circle cx="${c[0]}" cy="${c[1]}" r="${c[2]}" fill="${h}"/>`).join('');
   if(F.k==='afro')front=`<path d="M21 42 Q24 20 50 19 Q76 20 79 42 Q68 30 50 30 Q32 30 21 42 Z" fill="${h}"/>`;
   if(F.k==='long')front=`<path d="M20 46 Q18 15 50 15 Q82 15 80 46 Q76 32 60 26 Q44 36 24 34 Q21 40 20 46 Z" fill="${h}"/>`;
   if(F.k==='tails')front=`<path d="M21 42 Q20 15 50 15 Q80 15 79 42 Q70 28 50 31 Q30 28 21 42 Z" fill="${h}"/><path d="M50 15 v15" stroke="#0002" stroke-width="1.500"/>`;
   if(F.k!=='alien'&&F.k!=='cat')front+=`<circle cx="31" cy="56" r="4.500" fill="#f87171" opacity=".3"/><circle cx="69" cy="56" r="4.500" fill="#f87171" opacity=".3"/>`}
  return base+front+eyes(F.eye)+mouth(F.mouth)};
 const acc=(a)=>{switch(a){

    box.querySelector('#uxok').onclick=()=>{if(seq.length===n)cb(seq.map(j=>q.sh[j]).join(','))}}
  draw()}
function matchUI(box,q,cb){const pick=q.L.map(()=>-1);let sL=null,sR=null;
  const pair=(l,d)=>{const u=pick.indexOf(d);if(u>=0)pick[u]=-1;pick[l]=d;sL=sR=null;vib(15);draw()};
  function draw(){box.innerHTML='<div class="mtl">'+q.L.map((x,l)=>'<button type="button" class="mrow'+(sL===l?' sel':'')+(pick[l]>=0?' pair':'')+'" data-l="'+l+'" style="--c:'+COL[l%6]+'"><span class="mb">'+(l+1)+'</span><span class="ml">'+esc(x)+'</span><span class="ms">'+(pick[l]>=0?esc(q.R[pick[l]]):'?')+'</span></button>').join('')+'</div><div class="sqp">'+q.R.map((x,d)=>{const u=pick.indexOf(d);return '<button type="button" class="mchip'+(u>=0?' used':'')+(sR===d?' sel':'')+'" data-d="'+d+'"'+(u>=0?' style="--c:'+COL[u%6]+'"':'')+'>'+(u>=0?'<span class="mb">'+(u+1)+'</span>':'')+esc(x)+'</button>'}).join('')+'</div><div class="mhint">'+(sL!==null?'Teraz dotknij pasującej odpowiedzi':sR!==null?'Teraz dotknij elementu z numerem':'Dotknij elementu z numerem, potem pasującej odpowiedzi')+'</div><button class="b" id="uxok"'+(pick.some(x=>x<0)?' disabled':'')+'>Zatwierdź</button>';
    box.querySelectorAll('.mrow').forEach(b=>b.onclick=()=>{const l=+b.dataset.l;if(sR!==null)pair(l,sR);else if(pick[l]>=0){pick[l]=-1;sL=l;draw()}else{sL=sL===l?null:l;draw()}});
    box.querySelectorAll('.mchip').forEach(b=>b.onclick=()=>{const d=+b.dataset.d;if(sL!==null)pair(sL,d);else{sR=sR===d?null:d;draw()}});
    box.querySelector('#uxok').onclick=()=>{if(!pick.some(x=>x<0))cb(pick.map(d=>q.ro[d]).join(','))}}
  draw()}
const uxOk=v=>String(v).split(',').map(Number).every((x,k)=>x===k);
function question(){const q=S.q,done=sentQ===S.qi;view='q'+S.qi;clearInterval(timer);
  if(done){waitScreen();return}
  const long=q.o&&q.o.some(t=>String(t).length>26);
  app.innerHTML='<p class="qh">Pytanie '+(S.qi+1)+' z '+S.qn+'</p><div class="qt">'+qtF(q.t)+'</div><div class="tb"><i id="tbi"></i></div>'+(q.ty==='m'||q.ty==='s'?'<div class="ux" id="ux"></div>':q.ty==='c'?'<div class="opts n'+q.o.length+(long?' long':'')+'">'+q.o.map((t,i)=>'<button class="o" style="--c:'+COL[i]+'" data-i="'+i+'">'+shape(i)+'<span>'+esc(t)+'</span></button>').join('')+'</div>':'<div class="card" style="margin:auto 0"><div class="lbl">Twoja odpowiedź</div><input type="text" id="ta" maxlength="80" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="b" id="ts">Wyślij</button></div>');
  const send=v=>{if(sentQ===S.qi)return;sentQ=S.qi;const ms=Date.now()-qStart;vib(30);write({q:S.qi,v:v,ms:ms}).catch(()=>{});waitScreen()};
  if(q.ty==='m')matchUI($('#ux'),q,send);else if(q.ty==='s')seqUI($('#ux'),q,send);else if(q.ty==='c')app.querySelector('.opts').onclick=e=>{const b=e.target.closest('[data-i]');if(b)send(+b.dataset.i)};else{const i=$('#ta'),f=()=>{const v=i.value.trim();if(v)send(v)};$('#ts').onclick=f;i.onkeydown=e=>{if(e.key==='Enter')f()};setTimeout(()=>i.focus(),50)}
  timer=setInterval(()=>{const left=Math.max(0,q.dur*1000-(Date.now()-qStart)),b=document.getElementById('tbi');if(b)b.style.width=(left/(q.dur*10))+'%';if(left<=0){clearInterval(timer);if(sentQ!==S.qi&&view==='q'+S.qi){view='late';card('<h1>Koniec czasu</h1><p class="dots">Czekam na wynik</p>')}}},100)}
function waitScreen(){clearInterval(timer);view='sent'+S.qi;card('<div class="big bounce" style="width:120px">'+AV.svg(me.av)+'</div><h1>Odpowiedź wysłana</h1><p class="dots">Czekam na pozostałych</p>')}
/* ---- wyścig: pytania w pętli we własnym tempie ---- */
const nrm=s=>String(s==null?'':s).trim().toLowerCase().replace(/[’`´]/g,"'").replace(/\s+/g,' ').replace(/[.!?]+$/,'');
const dgHTML=d=>{if(!d)return '';const who=[];return '<div class="dgb">'+String(d).split('\n').filter(l=>l.trim()).map(l=>{const m=l.match(/^\s*([^:]{1,24}):\s*(.*)$/);if(!m)return '<p>'+esc(l)+'</p>';let k=who.indexOf(m[1].trim());if(k<0){who.push(m[1].trim());k=who.length-1}return '<div class="'+(k%2?'r':'')+'"><small>'+esc(m[1].trim())+'</small><span>'+esc(m[2])+'</span></div>'}).join('')+'</div>'};
let RS=null,rLeft=0,rT0=0,rTimer=0,rBusy=false;
const rKey=()=>'fwr_'+code+TS;
const myTeam=()=>S.tm&&S.tm[pid]!=null&&S.tn?S.tn[S.tm[pid]]:null;
const teamChip=()=>{const t=myTeam();return t?'<span class="tchip" style="--c:'+t[1]+'">'+esc(t[0])+'</span>':''};
function raceRender(){const tm=myTeam(),TW=S.md==='tower';
  if(S.ph==='lobby'){if(view!=='lobby'){view='lobby';card('<div class="big bounce">'+AV.svg(me.av)+'</div><h1>'+esc(me.n)+'</h1><p>Jesteś w grze! Patrz na tablicę.</p><p class="dots" style="margin-top:10px;opacity:.7">Czekam na start</p>')}return}
  if(S.ph==='teams'||S.ph==='go'){const k='tm'+(tm?tm[0]:'')+S.ph;if(view!==k){view=k;card((tm?'<p class="qh">Twoja drużyna</p><div class="tbig" style="--c:'+tm[1]+'">'+esc(tm[0])+'</div>':'<div class="big bounce" style="width:130px">'+AV.svg(me.av)+'</div>')+'<h1 style="margin-top:14px">'+(S.ph==='go'?'Start za chwilę!':'Przygotuj się')+'</h1><p>Odpowiadaj jak najszybciej. '+(TW?'Każda poprawna odpowiedź dokłada piętro do '+(tm?'wieży drużyny':'Twojej wieży')+'.':'Każda poprawna odpowiedź przesuwa '+(tm?'auto drużyny':'Twoje auto')+' do przodu.')+'</p>')}return}
  if(S.ph==='race'){rLeft=(+S.left||0)*1000;rT0=Date.now();if(!RS){const sv=LS.get(rKey());RS=sv&&sv.pid===pid?sv:{pid:pid,c:0,w:0,ord:[],i:0};rNext()}if(!rTimer)rTimer=setInterval(rClock,250);return}
  if(S.ph==='end'){if(view==='end')return;view='end';clearInterval(rTimer);rTimer=0;LS.del(rKey());const id=S.tm&&S.tm[pid]!=null?'t'+S.tm[pid]:pid,my=S.sc&&S.sc[id],pc=S.pc&&S.pc[pid],pl=my?my[1]:0;if(pl&&pl<=3)vib([60,80,60,80,160]);
    card('<div class="medal m'+(pl>=1&&pl<=3?pl:0)+'">'+(pl||'–')+'</div><h1>'+(pl===1?'Zwycięstwo!':pl&&pl<=3?'Podium!':TW?'Koniec budowy!':'Meta!')+'</h1>'+(tm?'<p>Drużyna '+teamChip()+'</p>':'<p>'+esc(me.n)+'</p>')+(pc?'<div class="stat"><div><small>Dobrze</small><b>'+pc[0]+'</b></div><div><small>Źle</small><b>'+pc[1]+'</b></div><div><small>Miejsce</small><b>'+(pl||'–')+'</b></div></div>':'')+'<p style="opacity:.75;margin-top:12px">Spójrz na tablicę, żeby zobaczyć podium.</p>')}}
function rClock(){const left=Math.max(0,rLeft-(Date.now()-rT0)),e=document.getElementById('rtl');if(e)e.textContent=Math.floor(left/60000)+':'+String(Math.floor(left/1000)%60).padStart(2,'0')}
function rNext(){if(!S||S.ph!=='race'||!S.qs||!S.qs.length)return;rBusy=false;if(RS.i>=RS.ord.length){const n=S.qs.length,last=RS.ord[RS.ord.length-1];let o=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}if(n>1&&o[0]===last)[o[0],o[1]]=[o[1],o[0]];RS.ord=o;RS.i=0}
  const q=S.qs[RS.ord[RS.i]];if(!q){RS.i=RS.ord.length;rNext();return}view='rq';const long=q.o&&q.o.some(x=>String(x).length>26);
  app.innerHTML='<div class="rbar">'+teamChip()+'<span><small>Dobrze</small><b id="rcc">'+RS.c+'</b></span><span><small>Czas</small><b id="rtl">–</b></span></div><div class="qt">'+qtF(q.t)+'</div>'+dgHTML(q.dg)+(q.ty==='m'||q.ty==='s'?'<div class="ux" id="ux"></div>':q.ty==='c'?'<div class="opts n'+q.o.length+(long?' long':'')+(q.dg?' sm':'')+'">'+q.o.map((x,i)=>'<button class="o" style="--c:'+COL[i]+'" data-i="'+i+'">'+shape(i)+'<span>'+esc(x)+'</span></button>').join('')+'</div>':'<div class="card" style="margin:auto 0"><div class="lbl">Twoja odpowiedź</div><input type="text" id="ta" maxlength="80" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="b" id="ts">Wyślij</button></div>')+'<div class="rfb" id="rfb"></div>';
  rClock();const qT=Date.now();const ans=v=>{if(rBusy)return;rBusy=true;const dt=(Date.now()-qT)/1000-(q.ty==='c'?0:q.ty==='m'?q.L.length*1.6:q.ty==='s'?q.it.length*1.4:4),pt=Math.max(5,Math.min(15,Math.round(16.5-dt)));const ok=q.ty==='m'||q.ty==='s'?uxOk(v):q.ty==='c'?(q.k||[]).indexOf(+v)>=0:(q.al||[]).some(a=>nrm(a)===nrm(v));if(ok){RS.c++;RS.p=(RS.p==null?(RS.c-1)*10:RS.p)+pt}else RS.w++;RS.i++;LS.set(rKey(),RS);write({m:'r',c:RS.c,w:RS.w,p:RS.p==null?RS.c*10:RS.p}).catch(()=>{});
    const fb=document.getElementById('rfb'),cor=q.ty==='m'||q.ty==='s'?q.cr:q.ty==='c'?(q.k||[]).map(k=>q.o[k]).join(', '):(q.al||[])[0];fb.className='rfb on '+(ok?'ok':'no');fb.innerHTML=ok?'<div>'+IC.ok+'<b>'+(S.md==='tower'?'Dobrze! +1':pt>=13?'Błyskawicznie!':pt>=9?'Szybko!':'Dobrze!')+'</b>'+(S.md==='tower'?'':'<small>Im szybciej odpowiadasz, tym dalej jedzie auto</small>')+'</div>':'<div>'+IC.no+'<b>Źle</b><small>Poprawna odpowiedź: '+esc(cor)+'</small></div>';vib(ok?30:[80,60,80]);setTimeout(rNext,ok?550:2000)};
  if(q.ty==='m')matchUI(document.getElementById('ux'),q,ans);else if(q.ty==='s')seqUI(document.getElementById('ux'),q,ans);else if(q.ty==='c')app.querySelector('.opts').onclick=e=>{const b=e.target.closest('[data-i]');if(b)ans(+b.dataset.i)};else{const i=document.getElementById('ta'),fn=()=>{const v=i.value.trim();if(v)ans(v)};document.getElementById('ts').onclick=fn;i.onkeydown=e=>{if(e.key==='Enter')fn()};setTimeout(()=>i.focus(),50)}}
const h=(location.hash||'').replace(/\D/g,'');if(h.length===6)open(h);else askCode();
window.__dbg={get S(){return S},get view(){return view},get pid(){return pid}};
